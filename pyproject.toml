[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newton"
version = "2.0.0"
description = "Constraint-first verification engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Jared Nashon Lewis", email = "jared@adacomputing.com" }
]
keywords = ["verification", "constraints", "bezier", "ledger", "education"]
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
]
graph = [
    "networkx>=3.0",
]
viz = [
    "matplotlib>=3.7",
]

[project.scripts]
newton = "newton.api.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["newton*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
